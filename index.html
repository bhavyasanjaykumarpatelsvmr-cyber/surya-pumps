<script>
    // --- CREDENTIALS ---
    const VALID_USER = "surya";
    const VALID_PASS = "surya123";

    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyYRzobvCTmtqm3HqCiGOan1C9rYa0",
      appId: "1:72100756068:web:061d25a0aa3787dbbebd71",
      authDomain: "surya-pumps.firebaseapp.com",

      projectId: "surya-pumps",
      storageBucket: "surya-pumps.appspot.com",
      messagingSenderId: "72100756068"
    };

    let db = null;
    let sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
    let mySessionRef = null;
    let appData = { stock: [], attendance: [], ledger: [] };

    // Initialize Firebase safely
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }
    } catch (e) {
      console.warn("Firebase initialization warning:", e);
    }

    // --- LOGIN & CONCURRENCY SYSTEM ---
    function attemptLogin() {
      try {
        const userEl = document.getElementById('loginId');
        const passEl = document.getElementById('loginPass');
        const errDiv = document.getElementById('loginErr');

        const user = userEl ? userEl.value.trim() : "";
        const pass = passEl ? passEl.value.trim() : "";

        // 1. Verify Credentials
        if (user !== VALID_USER || pass !== VALID_PASS) {
          if (errDiv) {
            errDiv.innerText = "Invalid User ID or Password!";
          } else {
            alert("Invalid User ID or Password!");
          }
          return;
        }

        // 2. Unlock App Screen
        const overlay = document.getElementById('loginOverlay');
        const appContent = document.getElementById('appContent');

        if (overlay) overlay.style.display = 'none';
        if (appContent) appContent.style.display = 'block';

        // 3. Set Default Date safely
        const dateInput = document.getElementById('attDate');
        if (dateInput) {
          dateInput.value = new Date().toISOString().substring(0, 10);
        }

        // 4. Background Concurrency & Cloud Sync
        if (db) {
          db.ref('active_sessions').get().then(snapshot => {
            const sessions = snapshot.val() || {};
            if (Object.keys(sessions).length >= 3) {
              if (errDiv) errDiv.innerText = "Access Denied: Maximum 3 users logged in.";
              if (overlay) overlay.style.display = 'flex';
              if (appContent) appContent.style.display = 'none';
              return;
            }

            mySessionRef = db.ref('active_sessions/' + sessionId);
            mySessionRef.set({ timestamp: Date.now(), user: user });
            mySessionRef.onDisconnect().remove();

            if (typeof startCloudSync === 'function') startCloudSync();
          }).catch(err => {
            console.warn("Session check failed, proceeding offline:", err);
            if (typeof startCloudSync === 'function') startCloudSync();
          });
        }
      } catch (err) {
        alert("Execution Error: " + err.message);
      }
    }
</script>
