<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surya Pumps App</title>

    <!-- INLINE MANIFEST (No extra file needed) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Surya Pumps","short_name":"SuryaPumps","start_url":".","display":"standalone","background_color":"%23ffffff","theme_color":"%230d6efd","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/891/891018.png","sizes":"512x512","type":"image/png"}]}'>

    <!-- INLINE SERVICE WORKER (No extra file needed) -->
    <script>
      if ('serviceWorker' in navigator) {
        const swCode = "self.addEventListener('fetch', function(e) {});";
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .header-bg { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; padding: 15px; border-radius: 0 0 12px 12px; }
    </style>
</head>
<body>

<div class="header-bg mb-3 text-center">
    <h4 class="m-0 fw-bold">☀️ Surya Pumps Management</h4>
</div>

<div class="container px-3">

    <!-- 1. STOCK TRACKER -->
    <div class="card p-3">
        <h6 class="fw-bold text-primary">📦 Stock Inventory</h6>
        <form id="stockForm" class="row g-2 mb-2">
            <div class="col-7"><input type="text" id="model" class="form-control form-control-sm" placeholder="Pump Model (e.g. V4 1.5HP)" required></div>
            <div class="col-5"><input type="number" id="qty" class="form-control form-control-sm" placeholder="Qty" required></div>
            <div class="col-7"><input type="number" id="price" class="form-control form-control-sm" placeholder="Price (₹)" required></div>
            <div class="col-5"><button type="submit" class="btn btn-sm btn-success w-100">Add Stock</button></div>
        </form>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr><th>Model</th><th>Price</th><th>Stock</th></tr></thead>
                <tbody id="stockTable"></tbody>
            </table>
        </div>
    </div>

    <!-- 2. STAFF ATTENDANCE -->
    <div class="card p-3">
        <h6 class="fw-bold text-primary">👤 Attendance Tracker</h6>
        <form id="attForm" class="row g-2 mb-2">
            <div class="col-6"><input type="text" id="staffName" class="form-control form-control-sm" placeholder="Staff Name" required></div>
            <div class="col-6">
                <select id="attStatus" class="form-select form-select-sm">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>
                </select>
            </div>
            <div class="col-12"><button type="submit" class="btn btn-sm btn-primary w-100">Log Attendance</button></div>
        </form>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr><th>Name</th><th>Date</th><th>Status</th></tr></thead>
                <tbody id="attendanceTable"></tbody>
            </table>
        </div>
    </div>

    <!-- 3. PAYMENT TRACKER -->
    <div class="card p-3">
        <h6 class="fw-bold text-primary">💰 Payment Ledger</h6>
        <form id="payForm" class="row g-2 mb-2">
            <div class="col-12"><input type="text" id="custName" class="form-control form-control-sm" placeholder="Customer Name" required></div>
            <div class="col-6"><input type="number" id="totalAmt" class="form-control form-control-sm" placeholder="Total Bill (₹)" required></div>
            <div class="col-6"><input type="number" id="paidAmt" class="form-control form-control-sm" placeholder="Paid (₹)" required></div>
            <div class="col-12"><button type="submit" class="btn btn-sm btn-warning text-white w-100">Save Payment</button></div>
        </form>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr><th>Customer</th><th>Pending</th><th>Status</th></tr></thead>
                <tbody id="paymentTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
// LocalStorage Database Helpers
const getDB = (key) => JSON.parse(localStorage.getItem(key) || '[]');
const saveDB = (key, data) => localStorage.setItem(key, JSON.stringify(data));

function renderAll() {
    // Render Stock
    const stock = getDB('surya_stock');
    document.getElementById('stockTable').innerHTML = stock.map(s => 
        `<tr><td>${s.model}</td><td>₹${s.price}</td><td><span class="badge bg-secondary">${s.qty}</span></td></tr>`
    ).join('') || '<tr><td colspan="3" class="text-muted text-center">No stock items</td></tr>';

    // Render Attendance
    const att = getDB('surya_att');
    document.getElementById('attendanceTable').innerHTML = att.map(a => 
        `<tr><td>${a.name}</td><td>${a.date}</td><td><span class="badge ${a.status==='Present'?'bg-success':'bg-danger'}">${a.status}</span></td></tr>`
    ).join('') || '<tr><td colspan="3" class="text-muted text-center">No logs today</td></tr>';

    // Render Payments
    const pay = getDB('surya_pay');
    document.getElementById('paymentTable').innerHTML = pay.map(p => {
        const pending = p.total - p.paid;
        const status = pending <= 0 ? 'Paid' : (p.paid > 0 ? 'Partial' : 'Pending');
        const badgeClass = status === 'Paid' ? 'bg-success' : 'bg-warning text-dark';
        return `<tr>
            <td>${p.customer}</td>
            <td class="text-danger">₹${pending}</td>
            <td><span class="badge ${badgeClass}">${status}</span></td>
        </tr>`;
    }).join('') || '<tr><td colspan="3" class="text-muted text-center">No payment entries</td></tr>';
}

// Event Listeners
document.getElementById('stockForm').onsubmit = (e) => {
    e.preventDefault();
    const stock = getDB('surya_stock');
    stock.push({
        model: document.getElementById('model').value,
        qty: document.getElementById('qty').value,
        price: document.getElementById('price').value
    });
    saveDB('surya_stock', stock);
    e.target.reset();
    renderAll();
};

document.getElementById('attForm').onsubmit = (e) => {
    e.preventDefault();
    const att = getDB('surya_att');
    const today = new Date().toLocaleDateString('en-IN');
    att.unshift({
        name: document.getElementById('staffName').value,
        status: document.getElementById('attStatus').value,
        date: today
    });
    saveDB('surya_att', att);
    e.target.reset();
    renderAll();
};

document.getElementById('payForm').onsubmit = (e) => {
    e.preventDefault();
    const pay = getDB('surya_pay');
    pay.unshift({
        customer: document.getElementById('custName').value,
        total: Number(document.getElementById('totalAmt').value),
        paid: Number(document.getElementById('paidAmt').value)
    });
    saveDB('surya_pay', pay);
    e.target.reset();
    renderAll();
};

// Initial Load
renderAll();
</script>
</body>
</html>
